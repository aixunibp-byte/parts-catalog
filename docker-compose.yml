services:
  db:
    image: postgres:16
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app_network]

  api:
    build: ./app
    restart: always
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [app_network]

  sync_worker:
    build: ./app
    restart: always
    env_file: .env
    command: ["python", "scheduler.py"]
    depends_on:
      db:
        condition: service_healthy
    networks: [app_network]

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - api
    networks: [app_network]

volumes:
  pgdata:
  uploads:

networks:
  app_network:
    driver: bridge
